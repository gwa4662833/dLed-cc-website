<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大极照明 DLED · 专业LED照明解决方案服务商 / Professional LED Lighting Solutions</title>
<meta name="description" content="大极照明 DLED · 商业、装饰与户外LED照明产品与整体方案 / Commercial, decorative & outdoor LED lighting products and solutions.">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   DLED · 大极照明 官网样式
   高档灰色基调 + 暖金强调，适合跨境独立站推广，移动端友好
   ============================================================ */
:root{
  --bg:#f3f3f5;          /* 高档浅灰 · 主背景 */
  --bg-2:#eaeaee;        /* 次级浅灰 */
  --card:#ffffff;        /* 卡片白 */
  --ink:#232327;         /* 深灰 · 深色区 */
  --ink-2:#2c2c31;       /* 次级深灰 */
  --ink-3:#333338;       /* 卡片深灰 */
  --gold:#c0a062;        /* 暖金强调 */
  --gold-2:#dcc08c;      /* 浅金 */
  --text:#232327;
  --text-soft:#6f6f77;
  --line:#e3e3e8;
  --line-dark:rgba(255,255,255,.1);
  --shadow:0 24px 56px -26px rgba(30,30,36,.25);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--bg);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
ul{list-style:none}
::selection{background:var(--gold);color:#fff}

/* ---------- 通用 ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:88px 0}
.section--gray{background:var(--bg)}
.section--gray2{background:var(--bg-2)}
.section--dark{background:var(--ink);color:#e9e9ed}
.sec-head{max-width:640px;margin-bottom:50px}
.sec-head--center{margin-left:auto;margin-right:auto;text-align:center}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:16px}
.eyebrow::before{content:"";width:32px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.sec-head--center .eyebrow{justify-content:center}
.sec-head--center .eyebrow::after{content:"";width:32px;height:2px;background:linear-gradient(270deg,var(--gold),transparent)}
.section--dark .eyebrow{color:var(--gold-2)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3}
.sec-title{font-size:clamp(26px,3.2vw,40px);letter-spacing:.04em}
.sec-sub{margin-top:12px;color:var(--text-soft);font-size:14.5px}
.section--dark .sec-sub{color:#a7a7af}

/* ---------- 顶部导航（浅灰高档） ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;background:rgba(243,243,245,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background .3s}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{height:36px;width:auto}
.brand-name{font-family:var(--serif);font-weight:700;color:var(--text);font-size:19px;letter-spacing:.08em;line-height:1.2}
.brand-name small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.38em;color:var(--gold);font-weight:500;margin-top:1px}
.nav-links{display:flex;align-items:center;gap:24px}
.nav-links a{color:#4a4a52;font-size:14.5px;position:relative;padding:6px 2px;transition:color .25s}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--gold);transition:width .3s}
.nav-links a:hover{color:var(--text)}
.nav-links a:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:14px}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:#fff}
.lang-switch button{background:none;border:none;padding:8px 16px;font-size:13.5px;cursor:pointer;color:var(--text-soft);font-family:var(--sans);transition:all .25s}
.lang-switch button.on{background:var(--ink);color:#fff}
.nav-cta{background:var(--ink);color:#fff;padding:10px 20px;border-radius:6px;font-weight:500;font-size:13.5px;letter-spacing:.06em;transition:background .25s,transform .25s}
.nav-cta:hover{background:var(--gold);color:#1d1d20;transform:translateY(-1px)}
.nav-toggle{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;cursor:pointer;align-items:center;justify-content:center}

/* ---------- Hero（深灰） ---------- */
.hero{background:var(--ink);color:#eee;padding:150px 0 96px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 76% 30%,rgba(192,160,98,.18),transparent 62%),radial-gradient(600px 420px at 10% 90%,rgba(192,160,98,.1),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;opacity:.4;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;pointer-events:none}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(192,160,98,.5);color:var(--gold-2);padding:7px 16px;border-radius:100px;font-size:12.5px;letter-spacing:.16em;margin-bottom:26px;background:rgba(192,160,98,.08)}
.hero-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.hero h1{font-size:clamp(34px,4.8vw,58px);font-weight:900;letter-spacing:.05em;line-height:1.24}
.hero h1 em{font-style:normal;color:transparent;background:linear-gradient(120deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text}
.hero-desc{margin:22px 0 34px;color:#a7a7af;font-size:15.5px;max-width:480px;font-weight:300}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border-radius:6px;font-size:14.5px;letter-spacing:.05em;font-weight:500;transition:all .28s;border:1px solid transparent}
.btn--gold{background:var(--gold);color:#191410}
.btn--gold:hover{background:var(--gold-2);transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(192,160,98,.5)}
.btn--ghost{border-color:rgba(255,255,255,.3);color:#fff}
.btn--ghost:hover{border-color:var(--gold);color:var(--gold-2)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0 26px;margin-top:48px;padding-top:28px;border-top:1px solid var(--line-dark);max-width:560px}
.hstat b{font-family:var(--serif);font-size:28px;color:var(--gold-2);font-weight:700;display:block;line-height:1.1}
.hstat b i{font-style:normal;font-size:15px;margin-left:2px}
.hstat span{font-size:12px;color:#8f8f98;letter-spacing:.1em;margin-top:5px;display:block}
.hero-visual{position:relative}
.hero-visual img{width:100%;aspect-ratio:16/10.5;object-fit:cover;border-radius:16px;border:1px solid rgba(192,160,98,.35);box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.hero-visual::before{content:"";position:absolute;inset:-12px;border:1px solid rgba(192,160,98,.22);border-radius:22px;z-index:-1}
.hero-chip{position:absolute;left:-30px;bottom:32px;background:rgba(44,44,49,.94);border:1px solid var(--line-dark);border-radius:12px;padding:13px 17px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px}
.hero-chip .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(192,160,98,.2),0 0 16px var(--gold)}
.hero-chip b{font-size:13.5px;color:#fff;display:block;line-height:1.3}
.hero-chip span{font-size:11px;color:#8f8f98}

/* ---------- 关于我们 ---------- */
.about-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:68px;align-items:center}
.about-img{position:relative}
.about-img img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.about-img::after{content:"";position:absolute;inset:auto -16px -16px auto;width:60%;height:60%;border:1px solid var(--gold);border-radius:14px;z-index:-1}
.about-copy h3{font-size:clamp(22px,2.6vw,32px);margin-bottom:18px}
.about-copy p{color:var(--text-soft);font-size:14.5px;margin-bottom:24px}
.value-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:26px}
.value{display:flex;gap:13px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:border-color .25s,transform .25s,box-shadow .25s}
.value:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:var(--shadow)}
.value svg{flex:none;width:30px;height:30px;margin-top:2px}
.value b{display:block;font-size:15px;margin-bottom:3px}
.value span{font-size:12.5px;color:var(--text-soft)}

/* ---------- 产品中心 ---------- */
.cat-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px}
.cat-tab{padding:8px 20px;border-radius:100px;border:1px solid var(--line);color:var(--text-soft);font-size:13.5px;cursor:pointer;transition:all .25s;background:#fff}
.cat-tab:hover{color:var(--text);border-color:var(--gold)}
.cat-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.prod-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .35s,border-color .35s,box-shadow .35s}
.prod-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:var(--shadow)}
.prod-card .img{aspect-ratio:1/1;overflow:hidden;position:relative;background:#f0f0f2}
.prod-card .img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.prod-card:hover .img img{transform:scale(1.06)}
.prod-cat{position:absolute;left:14px;top:14px;z-index:2;background:rgba(35,35,39,.82);border:1px solid rgba(192,160,98,.45);color:var(--gold-2);font-size:11.5px;letter-spacing:.12em;padding:4px 11px;border-radius:100px;backdrop-filter:blur(6px)}
.prod-info{padding:18px 20px 22px}
.prod-info h3{font-size:17.5px;margin-bottom:6px}
.prod-info p{font-size:13px;color:var(--text-soft);line-height:1.65;min-height:58px}
.prod-more{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--gold);font-size:13px;letter-spacing:.05em}
.prod-more svg{transition:transform .3s}
.prod-card:hover .prod-more svg{transform:translateX(5px)}
.prod-more-wrap{display:flex;justify-content:center;margin-top:38px}
.btn-outline{display:inline-flex;align-items:center;gap:8px;padding:13px 34px;border-radius:100px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;letter-spacing:.08em;cursor:pointer;font-family:var(--sans);transition:all .28s}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);background:#fff}
.catalog-cta{margin-top:34px;background:var(--ink);color:#fff;border-radius:16px;padding:34px 38px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.catalog-cta h3{font-family:var(--serif);font-size:clamp(18px,2.2vw,24px);margin-bottom:8px}
.catalog-cta p{color:#a7a7af;font-size:13.5px;max-width:620px;line-height:1.7}
.btn-dark{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:100px;background:var(--gold);color:#191410;font-size:14px;letter-spacing:.06em;font-weight:500;white-space:nowrap;transition:all .28s}
.btn-dark:hover{background:var(--gold-2);transform:translateY(-2px)}

/* ---------- 产品详情弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:22px}
.modal.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(20,20,24,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-dialog{position:relative;z-index:2;background:#fff;border-radius:16px;width:100%;max-width:940px;max-height:88vh;overflow:auto;display:grid;grid-template-columns:1.05fr .95fr;box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
.modal-close{position:absolute;right:14px;top:14px;z-index:4;width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--gold);color:#191410}
.modal-gallery{padding:22px}
.modal-gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#f0f0f2;display:block}
.modal-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.modal-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:.65;transition:opacity .2s}
.modal-thumbs img:hover{opacity:1}
.modal-thumbs img.on{border-color:var(--gold);opacity:1}
.modal-info{padding:36px 32px;display:flex;flex-direction:column;align-items:flex-start}
.modal-info h3{font-size:22px;margin:12px 0 12px;line-height:1.3}
.modal-info p{font-size:14px;color:var(--text-soft);line-height:1.75;margin-bottom:18px}
#modalFeats{list-style:none;margin:0 0 24px}
#modalFeats li{padding-left:20px;position:relative;font-size:13.5px;color:var(--text);margin-bottom:9px;line-height:1.5}
#modalFeats li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.prod-card{cursor:pointer}
@media(max-width:760px){.modal-dialog{grid-template-columns:1fr;max-height:92vh}.modal-info{padding:22px}}

/* ---------- 解决方案 ---------- */
.sol-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.sol-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 22px;transition:transform .3s,box-shadow .3s,border-color .3s}
.sol-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--gold)}
.sol-card svg{width:38px;height:38px;margin-bottom:14px}
.sol-card h3{font-size:17px;margin-bottom:8px}
.sol-card p{font-size:13px;color:var(--text-soft)}
.sol-banner{position:relative;margin-top:48px;border-radius:16px;overflow:hidden;aspect-ratio:21/7;display:flex;align-items:flex-end}
.sol-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sol-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,35,39,.85),rgba(35,35,39,.12))}
.sol-banner .inner{position:relative;z-index:2;padding:40px 44px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;flex-wrap:wrap}
.sol-banner h3{font-size:clamp(19px,2.4vw,28px);margin-bottom:6px}
.sol-banner p{color:#c3c3cb;font-size:14px;max-width:520px}

/* ---------- 案例 ---------- */
.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.case-card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:block}
.case-card img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.case-card:hover img{transform:scale(1.06)}
.case-card::after{content:"";position:absolute;inset:0;background:linear-gradient(190deg,transparent 42%,rgba(20,20,24,.86))}
.case-tag{position:absolute;left:16px;top:16px;z-index:2;font-size:11.5px;letter-spacing:.12em;color:var(--gold-2);border:1px solid rgba(192,160,98,.5);background:rgba(35,35,39,.55);padding:4px 12px;border-radius:100px;backdrop-filter:blur(6px)}
.case-info{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;color:#fff}
.case-info h3{font-size:17.5px;margin-bottom:4px}
.case-info p{font-size:12.5px;color:#bcbcc4}

/* ---------- 光影视频 ---------- */
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.video-card{background:var(--ink-2);border:1px solid var(--line-dark);border-radius:14px;overflow:hidden;transition:transform .35s,border-color .35s,box-shadow .35s}
.video-card:hover{transform:translateY(-6px);border-color:rgba(192,160,98,.5);box-shadow:0 30px 60px -24px rgba(0,0,0,.6)}
.video-card video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.video-info{padding:18px 20px}
.video-info h3{font-size:16px;color:#fff;margin-bottom:5px}
.video-info p{font-size:12.5px;color:#a7a7af}

/* ---------- 联系我们 ---------- */
.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;color:#e9e9ed}
.contact-grid h3{font-size:clamp(22px,2.4vw,30px);margin-bottom:12px;color:#fff}
.contact-grid .lead{color:#a7a7af;font-size:14.5px;margin-bottom:30px;max-width:460px}
.c-item{display:flex;gap:15px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line-dark)}
.c-item svg{flex:none;width:20px;height:20px;margin-top:3px}
.c-item b{display:block;font-size:12.5px;color:#8f8f98;letter-spacing:.12em;margin-bottom:3px}
.c-item span,.c-item a{font-size:15px;color:#fff;word-break:break-all}
.qr-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px;max-width:560px}
.qr-card{background:#fff;border-radius:14px;padding:16px}
.qr-card img{width:100%;border-radius:8px}
.qr-card b{display:block;text-align:center;font-size:13px;color:var(--text);margin-top:10px}
.qr-card span{display:block;text-align:center;font-size:11.5px;color:var(--text-soft);margin-top:2px}
.contact-form{background:var(--ink-2);border:1px solid var(--line-dark);border-radius:16px;padding:32px}
.contact-form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:#a7a7af;margin-bottom:7px;letter-spacing:.06em}
.field input,.field textarea{width:100%;background:var(--ink-3);border:1px solid var(--line-dark);border-radius:8px;padding:12px 15px;color:#fff;font-family:var(--sans);font-size:14px;outline:none;transition:border-color .25s}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:96px}
.form-note{font-size:12px;color:#7f7f88;margin-top:10px;text-align:center}

/* ---------- 页脚 ---------- */
.footer{background:#1b1b1f;color:#9a9aa2;padding:64px 0 0}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px;padding-bottom:48px}
.footer-brand{font-family:var(--serif);font-size:26px;font-weight:900;color:#fff;letter-spacing:.14em}
.footer-brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.42em;color:var(--gold);font-weight:400;margin-top:4px}
.footer-desc{margin-top:16px;font-size:13px;line-height:1.8;max-width:300px}
.footer h4{color:#fff;font-size:14.5px;letter-spacing:.12em;margin-bottom:18px;font-weight:500}
.footer ul li{margin-bottom:11px}
.footer ul a,.footer ul span{font-size:13.5px;transition:color .25s}
.footer ul a:hover{color:var(--gold)}
.footer-bottom{border-top:1px solid var(--line-dark);padding:20px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#73737c}

/* ---------- 浮动联系 ---------- */
.float-bar{position:fixed;right:20px;bottom:28px;z-index:90;display:flex;flex-direction:column;gap:12px}
.float-btn{width:46px;height:46px;border-radius:50%;background:rgba(44,44,49,.94);border:1px solid rgba(192,160,98,.45);display:flex;align-items:center;justify-content:center;color:var(--gold-2);cursor:pointer;backdrop-filter:blur(8px);transition:all .25s;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
.float-btn:hover{background:var(--gold);color:#191410;transform:translateY(-2px)}
.float-btn.top{background:rgba(44,44,49,.7);border-color:var(--line-dark);color:#8f8f98}
.float-btn.top:hover{color:#fff}

/* ---------- 响应式 ---------- */
@media (max-width:1080px){
  .hero-inner{grid-template-columns:1fr;gap:44px}
  .hero-stats{max-width:none;grid-template-columns:repeat(4,1fr)}
  .about-grid{grid-template-columns:1fr;gap:52px}
  .sol-grid{grid-template-columns:repeat(2,1fr)}
  .contact-grid{grid-template-columns:1fr}
}
@media (max-width:860px){

    /* 语言 / 文档 */

    var brandZh = D.brand.zh;
    var brandEn = D.brand.en;
    document.getElementById('footerBrandZh').textContent = brandZh + ' · ' + brandEn;
    document.getElementById('navLogo').src = D.logo;

    /* 导航 */

    document.getElementById('navLinks').innerHTML = t.map(function(item){
      return '<a href="' + item.href + '">' + item.label + '</a>';
    }).join('');
    document.getElementById('navCta').textContent = L('navCta');

    /* Hero */
    var h = L('hero');
    document.getElementById('heroBadge').textContent = h.badge;
    document.getElementById('heroTitleA').textContent = h.titleA;
    document.getElementById('heroTitleB').textContent = h.titleB;
    document.getElementById('heroDesc').textContent = h.desc;
    document.getElementById('heroCta1').textContent = h.cta1;
    document.getElementById('heroCta2').textContent = h.cta2;
    document.getElementById('heroChipTitle').textContent = h.chipTitle;
    document.getElementById('heroChipSub').textContent = h.chipSub;
    document.getElementById('heroStats').innerHTML = h.stats.map(function(s){
      return '<div class="hstat"><b>' + s.num + '<i>' + s.suffix + '</i></b><span>' + s.label + '</span></div>';
    }).join('');

    /* 关于 */
    var a = L('about');
    document.getElementById('aboutEyebrow').textContent = a.eyebrow;
    document.getElementById('aboutTitle').textContent = a.title;
    document.getElementById('aboutP1').textContent = a.paras[0];
    document.getElementById('aboutP2').textContent = a.paras[1];
    document.getElementById('valueGrid').innerHTML = a.values.map(function(v){
      return '<div class="value">' + iconSvg(v.icon) + '<div><b>' + v.title + '</b><span>' + v.desc + '</span></div></div>';
    }).join('');

    /* 产品 */
    var p = L('products');
    document.getElementById('prodEyebrow').textContent = p.eyebrow;
    document.getElementById('prodTitle').textContent = p.title;
    document.getElementById('prodSub').textContent = p.sub;
    var cats = D.cats[lang];
    document.getElementById('catTabs').innerHTML = cats.map(function(c, i){
      return '<button class="cat-tab' + (i === 0 ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>';
    }).join('');
    renderProducts();

    /* 解决方案 */
    var s = L('solutions');
    document.getElementById('solEyebrow').textContent = s.eyebrow;
    document.getElementById('solTitle').textContent = s.title;
    document.getElementById('solSub').textContent = s.sub;
    document.getElementById('solGrid').innerHTML = s.items.map(function(x){
      return '<div class="sol-card">' + iconSvg(x.icon) + '<h3>' + x.title + '</h3><p>' + x.desc + '</p></div>';
    }).join('');
    document.getElementById('solBannerTitle').textContent = s.banner.title;
    document.getElementById('solBannerDesc').textContent = s.banner.desc;
    document.getElementById('solBannerCta').textContent = s.banner.cta;

    /* 案例 */
    var c = L('cases');
    document.getElementById('caseEyebrow').textContent = c.eyebrow;
    document.getElementById('caseTitle').textContent = c.title;
    document.getElementById('caseSub').textContent = c.sub;
    document.getElementById('caseGrid').innerHTML = c.items.map(function(x){
      return '<a class="case-card" href="#contact">' +
        '<img src="' + x.img + '" alt="' + x.title + '" loading="lazy">' +
        '<span class="case-tag">' + x.tag + '</span>' +
        '<div class="case-info"><h3>' + x.title + '</h3><p>' + x.desc + '</p></div></a>';
    }).join('');

    /* 视频 */
    var v = L('videos');
    document.getElementById('videoEyebrow').textContent = v.eyebrow;
    document.getElementById('videoTitle').textContent = v.title;
    document.getElementById('videoSub').textContent = v.sub;
    document.getElementById('videoGrid').innerHTML = v.items.map(function(x){
      return '<div class="video-card"><video controls preload="metadata" playsinline poster="' + x.poster + '"><source src="' + x.src + '" type="video/mp4"></video>' +
        '<div class="video-info"><h3>' + x.title + '</h3><p>' + x.desc + '</p></div></div>';
    }).join('');

    /* 联系 */
    var ct = L('contact');
    document.getElementById('ctEyebrow').textContent = ct.eyebrow;
    document.getElementById('ctTitle').textContent = ct.title;
    document.getElementById('ctLead').textContent = ct.lead;
    var addr = lang === 'zh' ? D.contact.address.zh : D.contact.address.en;
    document.getElementById('contactList').innerHTML = [
      { icon: 'mail', label: D.contact.email.label[lang], val: D.contact.email.val, href: D.contact.email.href },
      { icon: 'chat', label: D.contact.wechat.label[lang], val: D.contact.wechat.val },
      { icon: 'pin', label: D.contact.address.label[lang], val: addr }
    ].map(function(it){
      var valHtml = it.href ? '<a href="' + it.href + '">' + it.val + '</a>' : '<span>' + it.val + '</span>';
      return '<div class="c-item">' + iconSvg(it.icon) + '<div><b>' + it.label + '</b>' + valHtml + '</div></div>';
    }).join('');
    var qrh = ct.qr;
    document.getElementById('qrRow').innerHTML = [
      { label: D.contact.wechat.label[lang], img: D.contact.wechat.qr, hint: qrh.wechat },
      { label: D.contact.whatsapp.label[lang], img: D.contact.whatsapp.qr, hint: qrh.whatsapp },
      { label: D.contact.facebook.label[lang], img: D.contact.facebook.qr, hint: qrh.facebook }
    ].map(function(q){
